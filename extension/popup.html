<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神シーンメモ</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #e1306c 0%, #f77737 100%);
      --bg-color: #fcfcfc;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #5d6d7e;
      --border-color: #edf2f7;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body { 
      width: 320px; 
      padding: 0; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .header {
      padding: 20px 20px 15px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: var(--primary-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    h3 { 
      margin: 0; 
      font-size: 18px; 
      letter-spacing: -0.02em;
    }

    .content {
      padding: 20px;
    }

    .description { 
      margin: 0 0 20px; 
      font-size: 13px; 
      color: var(--text-sub); 
      line-height: 1.6; 
    }

    .status-card { 
      background: var(--card-bg); 
      padding: 16px; 
      border-radius: 12px; 
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .status-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a0aec0;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .status-content {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .status-text { 
      margin: 0; 
      font-size: 15px; 
      font-weight: 700; 
    }

    .limits-text { 
      margin: 0; 
      font-size: 13px; 
      color: var(--text-sub); 
    }

    .action-container { 
      margin-top: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .upgrade-btn { 
      width: 100%; 
      padding: 12px; 
      background: var(--primary-gradient); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
    }

    .upgrade-btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(225, 48, 108, 0.4);
    }

    .upgrade-btn:active {
      transform: translateY(0);
    }

    .upgrade-btn:disabled { 
      background: #cbd5e0; 
      box-shadow: none;
      cursor: not-allowed; 
      transform: none;
    }

    .pro-badge {
      display: inline-block;
      padding: 2px 8px;
      background: var(--primary-gradient);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 5px;
    }

    .help-text { 
      font-size: 11px; 
      color: #a0aec0; 
      margin-top: 15px; 
      text-align: center; 
      line-height: 1.4;
    }

    .sub-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      margin-top: 16px;
    }

    .sub-card h4 {
      margin: 0 0 10px;
      font-size: 13px;
    }

    .code-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .code-value {
      flex: 1;
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-main);
      word-break: break-all;
      background: #f7fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
    }

    .secondary-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    .tertiary-btn {
      width: 100%;
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px dashed #d7dee7;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .secondary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .restore-details summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .restore-help,
    .restore-message {
      margin: 10px 0 0;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .restore-message.error {
      color: #c53030;
    }

    .restore-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .restore-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-main);
      background: #fff;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(44, 62, 80, 0.96);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">神</div>
    <h3>神シーンメモ</h3>
  </div>

  <div class="content">
    <p class="description">動画の再生時間に同期したコメントをローカルに記録・表示します。無料枠は50件、Proで無制限です。</p>
    
    <div class="status-card">
      <div class="status-title">License Status</div>
      <div class="status-content">
        <p class="status-text" id="license-status">確認中...</p>
        <p class="limits-text" id="limits-info"></p>
      </div>
    </div>

    <div id="license-code-card" class="sub-card" style="display: none;">
      <h4>ライセンスコード</h4>
      <div class="code-row">
        <p id="license-code-value" class="code-value">確認中...</p>
        <button id="copy-license-btn" class="secondary-btn" type="button">コピー</button>
      </div>
      <p class="help-text">再インストール後の Pro 復元に使います。</p>
    </div>

    <div id="action-container" class="action-container" style="display: none;">
      <button id="upgrade-btn" class="upgrade-btn">✨ Pro版にアップグレード</button>
      <p class="help-text">保存枠が無制限になる買い切り版です。<br>購入後、このデバイスに自動適用されます。<br>※ 2026-04-02 23:59:59（JST）までの初回利用ユーザーはベータ特典で無制限です。</p>
    </div>

    <div id="restore-card" class="sub-card">
      <details id="restore-details" class="restore-details">
        <summary>Proを復元する</summary>
        <p class="restore-help">購入時のメールアドレスとライセンスコードで、このデバイスに Pro を再適用します。</p>
        <div class="restore-form">
          <input id="restore-email" class="restore-input" type="email" placeholder="購入時メールアドレス">
          <input id="restore-license" class="restore-input" type="text" placeholder="ライセンスコード">
          <button id="restore-btn" class="secondary-btn" type="button">このデバイスでProを復元</button>
        </div>
        <p id="restore-message" class="restore-message"></p>
      </details>
    </div>

    <button id="open-onboarding-btn" class="tertiary-btn" type="button">使い方 / Pro案内を開く</button>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
