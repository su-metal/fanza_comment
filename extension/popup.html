<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神シーンメモ</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #e1306c 0%, #f77737 100%);
      --bg-color: #fcfcfc;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #5d6d7e;
      --border-color: #edf2f7;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    body { 
      width: 320px; 
      padding: 0; 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .header {
      padding: 20px 20px 15px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: var(--primary-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    h3 { 
      margin: 0; 
      font-size: 18px; 
      letter-spacing: -0.02em;
    }

    .content {
      padding: 20px;
    }

    .description { 
      margin: 0 0 20px; 
      font-size: 13px; 
      color: var(--text-sub); 
      line-height: 1.6; 
    }

    .status-card { 
      background: var(--card-bg); 
      padding: 16px; 
      border-radius: 12px; 
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .status-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a0aec0;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .status-content {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .status-text { 
      margin: 0; 
      font-size: 15px; 
      font-weight: 700; 
    }

    .limits-text { 
      margin: 0; 
      font-size: 13px; 
      color: var(--text-sub); 
    }

    .action-container { 
      margin-top: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .upgrade-btn { 
      width: 100%; 
      padding: 12px; 
      background: var(--primary-gradient); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
    }

    .upgrade-btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(225, 48, 108, 0.4);
    }

    .upgrade-btn:active {
      transform: translateY(0);
    }

    .upgrade-btn:disabled { 
      background: #cbd5e0; 
      box-shadow: none;
      cursor: not-allowed; 
      transform: none;
    }

    .pro-badge {
      display: inline-block;
      padding: 2px 8px;
      background: var(--primary-gradient);
      color: white;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 5px;
    }

    .help-text { 
      font-size: 11px; 
      color: #a0aec0; 
      margin-top: 15px; 
      text-align: center; 
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">神</div>
    <h3>神シーンメモ</h3>
  </div>

  <div class="content">
    <p class="description">動画の再生時間に同期したコメントをローカルに記録・表示します。無料枠は50件、Proで無制限です。</p>
    
    <div class="status-card">
      <div class="status-title">License Status</div>
      <div class="status-content">
        <p class="status-text" id="license-status">確認中...</p>
        <p class="limits-text" id="limits-info"></p>
      </div>
    </div>

    <div id="action-container" class="action-container" style="display: none;">
      <button id="upgrade-btn" class="upgrade-btn">✨ Pro版にアップグレード</button>
      <p class="help-text">保存枠が無制限になる買い切り版です。<br>購入後、このデバイスに自動適用されます。<br>※ 2026-04-02 23:59:59（JST）までの初回利用ユーザーはベータ特典で無制限です。</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
